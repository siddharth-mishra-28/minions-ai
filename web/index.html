<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Minions Cockpit</title>
    <script>
      // Paint with the right theme immediately (no flash): mirror the store's choice.
      try {
        const raw = localStorage.getItem('minion.theme');
        const t = raw === null ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : JSON.parse(raw);
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟡</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
